[package]
name = "aizome-koe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Koe: local voice dictation for Aizome and Sekka"
repository = "https://github.com/bitemyapp/koe"

[lib]
name = "koe"

[[bin]]
name = "koe"
path = "src/main.rs"

[features]
default = ["local", "ui"]
ui = ["dep:aizome-kit"]
local = ["dep:whisper-rs"]
openblas = ["local", "whisper-rs/openblas"]
vulkan = ["local", "whisper-rs/vulkan"]
cuda = ["local", "whisper-rs/cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hound = "3.5"
ksni = "0.3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
toml = "0.9"
whisper-rs = { version = "0.16", optional = true }
aizome-kit = { git = "https://github.com/bitemyapp/aizome", rev = "e012286df2199d2e8b0fd2e9a951835b2a8a6494", optional = true }

# Aizome uses a workspace path for its native toolkit. Resolve that package
# from the matching, pinned Sidestep source when consuming the kit standalone.
[patch."https://github.com/bitemyapp/aizome"]
sidestep-ui = { git = "https://github.com/bitemyapp/sidestep", rev = "dae957e913376a26e642d6abee533eb755fb9092" }

[profile.dev.package.tiny-skia]
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
